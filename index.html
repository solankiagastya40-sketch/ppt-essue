<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ff">
  <title>Open Canva</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24213a;
      background: #f5f2ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 18% 18%, rgba(178, 153, 255, 0.3), transparent 36%),
        radial-gradient(ellipse at 84% 82%, rgba(255, 190, 218, 0.32), transparent 34%),
        #f8f7fc;
    }

    main {
      width: min(100%, 520px);
      padding: 56px 40px;
      text-align: center;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(111, 86, 190, 0.12);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(48, 34, 96, 0.12);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 30px;
      font-weight: 700;
      border-radius: 20px;
      background: linear-gradient(135deg, #7d45df, #d34fc7);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 2.7rem);
      letter-spacing: -0.055em;
    }

    p {
      margin: 14px 0 30px;
      color: #706c81;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .button {
      display: inline-flex;
      min-height: 54px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 26px;
      color: #fff;
      font-size: 1rem;
      font-weight: 650;
      text-decoration: none;
      border-radius: 15px;
      background: linear-gradient(110deg, #7250e8, #a447d3);
      box-shadow: 0 10px 24px rgba(114, 80, 232, 0.28);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(114, 80, 232, 0.34);
    }

    .button:focus-visible {
      outline: 3px solid #34206e;
      outline-offset: 4px;
    }

    .arrow {
      font-size: 1.2rem;
      line-height: 1;
    }

    @media (max-width: 480px) {
      main {
        padding: 42px 24px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">C</div>
    <h1>Ready to create?</h1>
    <p>Click below to open your Canva link and get started.</p>
    <a class="button" href="https://canva.link/u6zwohyxmra0r27" target="_blank" rel="noopener noreferrer">
      Open Canva <span class="arrow" aria-hidden="true">↗</span>
    </a>
  </main>
</body>
</html>
